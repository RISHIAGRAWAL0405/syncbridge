<section class="services-grid-section" aria-label="What we do">
  <div class="container">
    <div class="sg-header reveal">
      <span class="tz-eyebrow tz-eyebrow-dark">What We Do</span>
      <h2 class="tz-section-title reveal reveal-delay-1">Full-Service Capabilities<br>Under One Roof.</h2>
    </div>

    <div class="sg-grid">
      @for (svc of data.services; track svc.id; let i = $index) {
        <a routerLink="/services" class="sg-card" [class.sg-card--featured]="svc.featured" [class]="'reveal reveal-delay-' + (i % 3 + 1)">
          <div class="sg-card-img img-mask">
            <img [src]="svc.image" [alt]="svc.title" loading="lazy" width="600" height="400">
          </div>
          <div class="sg-card-body">
            <div class="sg-card-icon" [innerHTML]="svc.icon" aria-hidden="true"></div>
            <h3 class="sg-card-title">{{ svc.title }}</h3>
            <p class="sg-card-desc">{{ svc.description }}</p>
            <span class="sg-card-cta">
              Know More
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
          </div>
        </a>
      }
    </div>

    <div class="sg-footer reveal">
      <a routerLink="/services" class="tz-btn-lime">
        View All Services
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</section>
