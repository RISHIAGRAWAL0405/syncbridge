<section class="testimonials" aria-label="Client testimonials">
  <div class="testimonials-bg"></div>
  <div class="container">
    <div class="testimonials-header reveal">
      <span class="section-label">Testimonials</span>
      <h2 class="section-title">Words From<br><em>Our Clients</em></h2>
    </div>

    <div class="swiper testimonials-swiper reveal reveal-delay-2">
      <div class="swiper-wrapper">
        @for (t of data.testimonials; track t.id) {
          <div class="swiper-slide">
            <div class="testimonial-card glass">
              <div class="testimonial-quote-icon" aria-hidden="true">"</div>
              <blockquote class="testimonial-quote">{{ t.quote }}</blockquote>
              <div class="testimonial-author">
                <div class="author-img-wrap">
                  <img [src]="t.image" [alt]="t.name" loading="lazy" width="64" height="64">
                </div>
                <div class="author-info">
                  <cite class="author-name">{{ t.name }}</cite>
                  <span class="author-role">{{ t.role }}</span>
                </div>
                <div class="author-stars" [attr.aria-label]="t.rating + ' out of 5 stars'">
                  @for (s of [1,2,3,4,5]; track s) {
                    <span class="star" [class.filled]="s <= t.rating">★</span>
                  }
                </div>
              </div>
            </div>
          </div>
        }
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>
