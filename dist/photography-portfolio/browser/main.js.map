<nav class="navbar" [class.scrolled]="scrolled()" [class.menu-open]="menuOpen()" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <!-- Logo -->
    <a routerLink="/" class="nav-logo" (click)="closeMenu()" aria-label="Lumière Studio Home">
      <span class="logo-mark">L</span>
      <span class="logo-name">umière</span>
    </a>

    <!-- Desktop Links -->
    <ul class="nav-links" role="list">
      @for (link of navLinks; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="active" class="nav-link"
             (mouseenter)="cursor.setHover(true)" (mouseleave)="cursor.setHover(false)">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Right Actions -->
    <div class="nav-actions">
      <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
              (mouseenter)="cursor.setHover(true)" (mouseleave)="cursor.setHover(false)">
        @if (theme.isDark()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        }
      </button>

      <a routerLink="/contact" class="nav-cta btn-primary" (mouseenter)="cursor.setHover(true)" (mouseleave)="cursor.setHover(false)">
        <span>Book Session</span>
      </a>

      <!-- Hamburger -->
      <button class="hamburger" [class.active]="menuOpen()" (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen()" role="dialog" aria-modal="true">
    <div class="mobile-menu-bg"></div>
    <div class="mobile-menu-content">
      <ul class="mobile-links" role="list">
        @for (link of navLinks; track link.path; let i = $index) {
          <li [style.--i]="i">
            <a [routerLink]="link.path" routerLinkActive="active" class="mobile-link" (click)="closeMenu()">
              <span class="mobile-link-num">0{{ i + 1 }}</span>
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <div class="mobile-footer">
        <a routerLink="/contact" class="btn-primary" (click)="closeMenu()"><span>Book a Session</span></a>
        <div class="mobile-social">
          <a href="#" aria-label="Instagram">IG</a>
          <a href="#" aria-label="Facebook">FB</a>
          <a href="#" aria-label="Pinterest">PT</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Scroll Progress -->
<div class="scroll-progress" [style.transform]="scrollProgress"></div>
