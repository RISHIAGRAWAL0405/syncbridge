<div class="admin-wrapper" [class.sidebar-collapsed]="!sidebarOpen">
  <!-- Sidebar -->
  <nav class="admin-sidebar d-flex flex-column">
    <div class="sidebar-brand d-flex align-items-center px-3 py-3 border-bottom">
      <i class="bi bi-shield-lock-fill text-primary me-2 fs-5"></i>
      <span class="brand-text fw-bold">Sync Bridge</span>
    </div>

    <div class="sidebar-nav flex-grow-1 py-2 overflow-auto">
      <ul class="nav flex-column px-2">
        <li class="nav-item" *ngFor="let item of navItems">
          <a class="nav-link d-flex align-items-center gap-2 rounded-2 py-2 px-3 mb-1"
            [routerLink]="item.route" routerLinkActive="active">
            <i class="bi {{ item.icon }} nav-icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="sidebar-footer border-top p-3">
      <div class="d-flex align-items-center gap-2">
        <div class="avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold">
          {{ userInitials }}
        </div>
        <div class="flex-grow-1 overflow-hidden nav-label">
          <div class="small fw-semibold text-truncate">{{ user?.firstName }} {{ user?.lastName }}</div>
          <div class="text-muted" style="font-size:0.7rem">{{ user?.userType }}</div>
        </div>
        <button class="btn btn-sm btn-outline-danger nav-label" (click)="logout()" title="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="admin-main d-flex flex-column">
    <!-- Topbar -->
    <header class="admin-topbar d-flex align-items-center px-3 px-md-4 border-bottom">
      <button class="btn btn-sm btn-light me-3" (click)="toggleSidebar()">
        <i class="bi bi-list fs-5"></i>
      </button>
      <div class="flex-grow-1"></div>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-primary-subtle text-primary">{{ user?.userType }}</span>
        <div class="avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold">
          {{ userInitials }}
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="admin-content flex-grow-1 overflow-auto p-3 p-md-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
