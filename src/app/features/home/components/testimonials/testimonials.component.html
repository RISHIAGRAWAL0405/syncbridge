<section class="testimonials" aria-label="Client testimonials">
  <div class="container">
    <div class="t-header reveal">
      <span class="tz-eyebrow tz-eyebrow-dark">Testimonials</span>
      <h2 class="tz-section-title reveal reveal-delay-1">What Our Clients Say.</h2>
    </div>

    <div class="t-carousel reveal reveal-delay-2">
      @for (t of data.testimonials; track t.id; let i = $index) {
        <div class="t-slide" [class.active]="active() === i" [attr.aria-hidden]="active() !== i">
          <div class="t-card">
            <div class="t-quote-mark" aria-hidden="true">"</div>
            <blockquote class="t-quote">{{ t.quote }}</blockquote>
            <div class="t-author">
              @if (t.image) {
                <img [src]="t.image" [alt]="t.name" loading="lazy" width="52" height="52" class="t-avatar">
              }
              <div class="t-author-info">
                <cite class="t-name">{{ t.name }}</cite>
                <span class="t-role">{{ t.role }}, {{ t.company }}</span>
              </div>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="t-controls">
      <button class="t-btn" (click)="prev()" aria-label="Previous testimonial">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="t-dots" role="tablist">
        @for (t of data.testimonials; track t.id; let i = $index) {
          <button class="t-dot" [class.active]="active() === i" (click)="goTo(i)"
                  role="tab" [attr.aria-selected]="active() === i" [attr.aria-label]="'Testimonial ' + (i+1)">
          </button>
        }
      </div>
      <button class="t-btn" (click)="next()" aria-label="Next testimonial">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</section>
