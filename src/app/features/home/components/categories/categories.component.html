<section class="categories" id="categories" aria-label="Photography categories">
  <div class="container">
    <div class="categories-header reveal">
      <span class="section-label">Specializations</span>
      <h2 class="section-title">Every Story<br><em>Deserves a Master</em></h2>
    </div>
  </div>

  <div class="categories-grid">
    @for (cat of data.categories; track cat.id; let i = $index) {
      <a [routerLink]="['/portfolio']" [queryParams]="{category: cat.id}" class="cat-card reveal"
         [class]="'reveal-delay-' + (i % 4 + 1)"
         (mouseenter)="cursor.setHover(true, 'Explore')" (mouseleave)="cursor.setHover(false)">
        <div class="cat-img-wrap img-mask">
          <img [src]="cat.image" [alt]="cat.label + ' photography'" loading="lazy" width="800" height="600">
        </div>
        <div class="cat-overlay"></div>
        <div class="cat-content">
          <div class="cat-top">
            <span class="cat-count">{{ cat.count }} works</span>
          </div>
          <div class="cat-bottom">
            <h3 class="cat-title">{{ cat.label }}</h3>
            <div class="cat-arrow">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
          </div>
        </div>
      </a>
    }
  </div>
</section>
