<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card card shadow-lg border-0 p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <i class="bi bi-key-fill text-primary" style="font-size:2.5rem"></i>
      </div>
      <h4 class="fw-bold mb-1">Reset Password</h4>
      <p class="text-muted small">Enter the OTP sent to your email</p>
    </div>

    <div *ngIf="error" class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
    </div>
    <div *ngIf="success" class="alert alert-success py-2 small">
      <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold small">OTP Code</label>
        <input type="text" class="form-control" formControlName="otp_code" placeholder="Enter OTP"
          [class.is-invalid]="f['otp_code'].invalid && f['otp_code'].touched">
        <div class="invalid-feedback">OTP is required</div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small">New Password</label>
        <input type="password" class="form-control" formControlName="new_password" placeholder="Min 6 characters"
          [class.is-invalid]="f['new_password'].invalid && f['new_password'].touched">
        <div class="invalid-feedback">
          <span *ngIf="f['new_password'].errors?.['required']">Password is required</span>
          <span *ngIf="f['new_password'].errors?.['minlength']">Minimum 6 characters</span>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small">Confirm Password</label>
        <input type="password" class="form-control" formControlName="confirm_password" placeholder="Repeat password"
          [class.is-invalid]="(f['confirm_password'].invalid && f['confirm_password'].touched) || (form.errors?.['mismatch'] && f['confirm_password'].touched)">
        <div class="invalid-feedback">Passwords do not match</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <div class="text-center">
        <a routerLink="/auth/login" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
