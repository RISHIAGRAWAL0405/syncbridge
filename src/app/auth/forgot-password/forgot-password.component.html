<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card card shadow-lg border-0 p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <i class="bi bi-envelope-lock-fill text-primary" style="font-size:2.5rem"></i>
      </div>
      <h4 class="fw-bold mb-1">Forgot Password</h4>
      <p class="text-muted small">Enter your username to receive a reset OTP</p>
    </div>

    <div *ngIf="error" class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" class="form-control border-start-0 ps-0"
            formControlName="user_name" placeholder="Enter your username"
            [class.is-invalid]="f['user_name'].invalid && f['user_name'].touched">
          <div class="invalid-feedback">Username is required</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Sending OTP...' : 'Send OTP' }}
      </button>

      <div class="text-center">
        <a routerLink="/auth/login" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
